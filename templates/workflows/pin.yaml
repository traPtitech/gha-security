# 各リポジトリに配置する caller ワークフロー（定期的な固定 PR の自動作成）。
# .github/workflows/pin.yaml として配置する。
name: pin

on:
  schedule:
    - cron: "0 21 * * 0" # 月曜 6:00 JST
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  pin:
    uses: traPtitech/gha-security/.github/workflows/pin.yaml@main
    with:
      # Dependabot / Renovate を使っていないリポジトリのみ true にする
      # （bot 導入済みリポジトリで true にすると更新 PR が競合する）
      update: false
    # App トークンを渡すと、作成された PR で CI が走るようになる（org secrets を想定）
    secrets:
      app-id: ${{ secrets.GHA_SECURITY_APP_ID }}
      app-private-key: ${{ secrets.GHA_SECURITY_APP_PRIVATE_KEY }}
