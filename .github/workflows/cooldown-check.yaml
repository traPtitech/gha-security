# cooldown-check: PR で追加/変更された依存のうち、公開から日が浅いバージョンを検出して fail する。
# Dependabot / Renovate を使っていないリポジトリや、手元で install して lockfile ごと
# 上げてくる PR にも効く「PR 時点の cooldown ゲート」。
#
# 呼び出し側（pull_request トリガー）に必要な permissions:
#   contents: read, pull-requests: write（違反の PR コメント投稿用。pr-comment: false なら read のみ）
# 違反は sticky な PR コメント（bot コメント1つを更新）でも通知される。fork PR では
# トークンが読み取り専用のためコメントは投稿されない（チェック自体は動く）。
# 緊急時は PR に override ラベル（デフォルト: cooldown-override）を付けると公開日時cooldownのみをスキップする。
# npm artifact identity検査はoverride時も継続する。
name: cooldown-check

on:
  workflow_call:
    inputs:
      npm-min-age-days:
        description: npm のしきい値（日）。0 で npm チェックを無効化
        type: number
        default: 3
      max-lookups:
        description: PRごとに外部へ行う一意なcooldown lookupの最大数
        type: number
        default: 50
      lookup-timeout:
        description: 各外部cooldown lookupのタイムアウト秒数
        type: number
        default: 15
      actions-min-age-days:
        description: GitHub Actions のしきい値（日）。0 で actions チェックを無効化
        type: number
        default: 3
      exclude:
        description: 除外パターン（改行区切り glob）
        type: string
        default: ""
      override-label:
        description: このラベルが付いた PR はチェックをスキップ
        type: string
        default: cooldown-override
      pr-comment:
        description: 違反内容を PR コメント（sticky）として投稿するか
        type: boolean
        default: true

jobs:
  cooldown-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: traPtitech/gha-security/actions/cooldown-check@ded3eccb9aef96cb01da96e86a449e84220161f9
        with:
          npm-min-age-days: ${{ inputs.npm-min-age-days }}
          max-lookups: ${{ inputs.max-lookups }}
          lookup-timeout: ${{ inputs.lookup-timeout }}
          actions-min-age-days: ${{ inputs.actions-min-age-days }}
          exclude: ${{ inputs.exclude }}
          override-label: ${{ inputs.override-label }}
          pr-comment: ${{ inputs.pr-comment }}
