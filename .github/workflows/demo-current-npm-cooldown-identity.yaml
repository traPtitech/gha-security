name: Demo - current npm cooldown and identity comments
on:
  pull_request:
    paths:
      - examples/dogfood/current-cooldown/package-lock.json
      - .github/workflows/demo-current-npm-cooldown-identity.yaml
permissions:
  contents: write
  pull-requests: write
jobs:
  demonstrate-current-npm-cooldown:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: traPtitech/gha-security/actions/cooldown-check@5613481ed120213d620917ea74c585f931a8e45e
        with:
          npm-min-age-days: 99999
          actions-min-age-days: 0
  demonstrate-current-npm-identity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: fixture
        shell: bash
        run: |
          git config user.name demo
          git config user.email demo@example.invalid
          mkdir -p examples/dogfood/current-identity
          printf '%s\n' '{"lockfileVersion":3,"packages":{"node_modules/lodash":{"version":"4.17.21","resolved":"https://registry.npmjs.org/lodash/-/lodash-4.17.21.tgz","integrity":"sha512-original"}}}' > examples/dogfood/current-identity/package-lock.json
          git add examples/dogfood/current-identity/package-lock.json && git commit -m base
          echo "base=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          python3 -c "p='examples/dogfood/current-identity/package-lock.json'; s=open(p).read().replace('sha512-original','sha512-substituted'); open(p,'w').write(s)"
          git add examples/dogfood/current-identity/package-lock.json && git commit -m substitution
          echo "head=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: traPtitech/gha-security/actions/cooldown-check@5613481ed120213d620917ea74c585f931a8e45e
        with:
          base-sha: ${{ steps.fixture.outputs.base }}
          head-sha: ${{ steps.fixture.outputs.head }}
          npm-min-age-days: 0
          actions-min-age-days: 0
