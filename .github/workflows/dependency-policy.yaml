# dependency-policy: CI が lockfile を厳密に使用していることと、
# package.json の依存が range / tag ではないことを検査する。
name: dependency-policy

on:
  workflow_call:
    inputs:
      require-lockfile:
        description: package.json と同じディレクトリにlockfileを必須にするか（library等はfalseで明示除外）
        type: boolean
        default: true
      go-warning-pr-comment:
        description: Go integrity warningをPR上のsticky commentとして投稿するか
        type: boolean
        default: true

jobs:
  dependency-policy:
    permissions:
      contents: read
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: traPtitech/gha-security/actions/dependency-policy@5016284944abf6310caebe3a264ec205fd834616
        with:
          require-lockfile: ${{ inputs.require-lockfile }}
          go-warning-pr-comment: ${{ inputs.go-warning-pr-comment }}
