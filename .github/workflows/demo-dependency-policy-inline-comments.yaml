name: Demo - dependency-policy inline comments

on:
  pull_request:
    paths:
      - examples/dogfood/dependency-policy-inline/package.json
      - .github/workflows/example-dependency-policy-inline.yaml
      - .github/workflows/demo-dependency-policy-inline-comments.yaml

permissions:
  contents: read
  pull-requests: write

jobs:
  demonstrate-dependency-policy-inline-comments:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Detect intentional policy violations and post CI comments
        uses: traPtitech/gha-security/actions/dependency-policy@a93cbce12c64de5ee451cfd3118caeab4530cdca
