name: pin-docker
description: |
  Dockerfile の FROM / Compose の image: / GitHub Actions の container・services image・docker:// actionを digest 固定する。
  digest 解決は frizbee(単一参照モード)、書き換えは同梱の pin_docker.py が行う。
  事前に setup-tools で frizbee をインストールしておくこと（check モードでは不要）。
inputs:
  mode:
    description: "fix（書き換え）| check（検査のみ・ネットワーク不要）"
    default: fix
  files:
    description: 対象ファイル（改行区切り。省略時はリポジトリ全体を探索）
    default: ""
  file-exclude-regex:
    description: 除外するファイルパスの正規表現（開発用 compose など）
    default: '(^|/)(docker-)?compose[^/]*\.(dev|local|override)[^/]*\.ya?ml$'
  image-exclude-regex:
    description: 除外するイメージ参照の正規表現
    default: ""
  allowed-registries:
    description: "fix モードで digest 解決を許可するレジストリ（カンマ区切り）。既定: docker.io,ghcr.io,quay.io。private registry は明示的に追加する"
    default: "docker.io,ghcr.io,quay.io"
  max-resolutions:
    description: "fix モードで解決する異なるイメージ参照の最大数（既定: 50）"
    default: "50"
  resolution-timeout:
    description: "frizbee による各イメージ解決のタイムアウト秒数（既定: 15）"
    default: "15"
runs:
  using: composite
  steps:
    - name: Pin docker image references
      shell: bash
      env:
        MODE: ${{ inputs.mode }}
        FILES: ${{ inputs.files }}
        FILE_EXCLUDE: ${{ inputs.file-exclude-regex }}
        IMAGE_EXCLUDE: ${{ inputs.image-exclude-regex }}
        ALLOWED_REGISTRIES: ${{ inputs.allowed-registries }}
        MAX_RESOLUTIONS: ${{ inputs.max-resolutions }}
        RESOLUTION_TIMEOUT: ${{ inputs.resolution-timeout }}
      run: |
        set -euo pipefail
        args=()
        [ "$MODE" = "check" ] && args+=(--check)
        [ -n "$FILE_EXCLUDE" ] && args+=(--file-exclude-regex "$FILE_EXCLUDE")
        [ -n "$IMAGE_EXCLUDE" ] && args+=(--image-exclude-regex "$IMAGE_EXCLUDE")
        args+=(--allowed-registries "$ALLOWED_REGISTRIES")
        args+=(--max-resolutions "$MAX_RESOLUTIONS")
        args+=(--resolution-timeout "$RESOLUTION_TIMEOUT")
        if [ -n "$FILES" ]; then
          mapfile -t files <<< "$FILES"
          args+=(--files "${files[@]}")
        fi
        python3 "${GITHUB_ACTION_PATH}/pin_docker.py" "${args[@]}"
